<svg xmlns="http://www.w3.org/2000/svg" width="420" height="48" viewBox="0 0 420 48" fill="none" role="img" aria-hidden="true">
  <style>
    .track {
      stroke: #4ade80;
      stroke-opacity: 0.2;
    }
    .draw {
      stroke: #4ade80;
      stroke-dasharray: 396;
      stroke-dashoffset: 396;
      animation: draw 2.4s ease-out forwards;
    }
    .dot {
      fill: #4ade80;
    }
    .ring {
      fill: none;
      stroke: #4ade80;
      stroke-width: 1;
      transform-box: fill-box;
      transform-origin: center;
      animation: ring 2.2s ease-out 2.2s infinite;
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes ring {
      0% { opacity: 0.65; transform: scale(1); }
      100% { opacity: 0; transform: scale(2.6); }
    }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
      .ring { animation: none; opacity: 0; }
    }
  </style>
  <line class="track" x1="24" y1="24" x2="408" y2="24" stroke-width="1" stroke-linecap="round"/>
  <line class="draw" x1="24" y1="24" x2="408" y2="24" stroke-width="1" stroke-linecap="round"/>
  <circle class="ring" cx="12" cy="24" r="4"/>
  <circle class="dot" cx="12" cy="24" r="3"/>
</svg>
