<svg xmlns="http://www.w3.org/2000/svg" width="680" height="228" viewBox="0 0 680 228" fill="none" role="img" aria-label="Satvik Srivastava">
  <defs>
    <clipPath id="card">
      <rect width="680" height="228" rx="16"/>
    </clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .r1 { animation: role 12s infinite; }
      .r2 { animation: role 12s infinite; animation-delay: 3s; }
      .r3 { animation: role 12s infinite; animation-delay: 6s; }
      .r4 { animation: role 12s infinite; animation-delay: 9s; }
      .dot { animation: pulse 2.4s ease-out infinite; }
      .ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: ring 2.4s ease-out infinite;
      }
      @keyframes role {
        0%, 20% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      @keyframes ring {
        0% { opacity: 0.5; transform: scale(1); }
        100% { opacity: 0; transform: scale(2.4); }
      }
      @media (prefers-reduced-motion: reduce) {
        .r1 { animation: none; opacity: 1; }
        .r2, .r3, .r4 { animation: none; opacity: 0; }
        .dot, .ring { animation: none; }
        .ring { opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="680" height="228" fill="#141414"/>
    <rect width="680" height="90" fill="url(#sheen)"/>
    <rect x="0" y="0" width="4" height="228" fill="#4ade80"/>
  </g>
  <rect x="0.5" y="0.5" width="679" height="227" rx="16" fill="none" stroke="#52525b"/>

  <circle class="ring" cx="48" cy="58" r="5" fill="none" stroke="#4ade80" stroke-width="1"/>
  <circle class="dot" cx="48" cy="58" r="3.5" fill="#4ade80"/>

  <text x="64" y="66" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="600">Satvik Srivastava</text>

  <text class="r1" x="48" y="100" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Full Stack DevOps Developer</text>
  <text class="r2" x="48" y="100" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" opacity="0">Web3 Builder</text>
  <text class="r3" x="48" y="100" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" opacity="0">Blockchain Developer</text>
  <text class="r4" x="48" y="100" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" opacity="0">AI/ML Engineer</text>

  <text fill="#a1a1aa" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">
    <tspan x="48" y="142">Full-stack engineer at M-World. Building production web, AI,</tspan>
    <tspan x="48" y="166">and blockchain systems.</tspan>
  </text>

  <text x="48" y="200" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">B.Tech CSE  ·  KIET  ·  2024–2028</text>
</svg>
